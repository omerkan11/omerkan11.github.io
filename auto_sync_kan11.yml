name: Auto-Sync @KAN11 YouTube Transcripts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-kan11-subtitles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install transcript tools
        run: |
          pip install -U youtube-transcript-api scrapetube yt-dlp

      - name: Scan @KAN11 Main Channel for New Episodes
        run: python3 sync_kan11_youtube.py

      - name: Commit updated memesJson.json
        run: |
          git config user.name "kan11-memes-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memesJson.json
          git diff --staged --quiet || (git commit -m "Auto-update @KAN11 transcripts" && git push)
