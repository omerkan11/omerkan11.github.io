name: Auto-Sync @KAN11 YouTube Transcripts

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-kan11-subtitles:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install transcript & subtitle tools
        run: |
          pip install -U youtube-transcript-api scrapetube yt-dlp

      - name: Deep-Scan Entire @KAN11 Channel
        env:
          MAX_RUNTIME_MINUTES: "45"
        run: python3 sync_kan11_youtube.py

      - name: Commit updated memesJson.json & checkpoint state
        run: |
          git config user.name "kan11-memes-bot"
          git config user.email "bot@users.noreply.github.com"
          git add memesJson.json scanned_videos.json || true
          git diff --staged --quiet || (git commit -m "Auto-update @KAN11 full-channel transcripts" && git push)
